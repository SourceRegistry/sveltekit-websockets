version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # These pin each other as exact peers; updated one at a time they fail to install.
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
          - vitest-browser-svelte
      sveltekit:
        patterns:
          - '@sveltejs/*'
          - svelte
          - svelte-check
      semantic-release:
        patterns:
          - '@semantic-release/*'
    ignore:
      # svelte-check supports TypeScript up to 6.
      - dependency-name: typescript
        versions: ['>=7.0.0']
      # Must parse what SvelteKit serializes. devalue 6 writes and reads the same format as the devalue 5
      # SvelteKit 3 uses (checked across all supported types), so allow 6.x; review the next major by hand.
      - dependency-name: devalue
        versions: ['>=7.0.0']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
